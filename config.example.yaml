# 萝卜快跑后端示例配置
# 使用说明：复制本文件，重命名为 config.yaml，填充真实信息
system:
  db-type: pgsql
  oss-type: local
  router-prefix: ""
  addr: 8888
  iplimit-count: 15000
  iplimit-time: 3600
  use-multipoint: false
  use-redis: false
  use-mongo: false

pgsql:
  prefix: ""
  port: 5432
  config: ""
  db-name: "radish"
  username: "your_username"
  password: "your_password"
  path: "127.21.0.3"
  engine: ""
  log-mode: ""
  max-idle-conns: 10
  max-open-conns: 100
  conn-max-lifetime: 0
  singular: false
  log-zap: false

redis-list:
  - name: cache
    addr: 127.0.0.1:7000
